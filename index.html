<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医体质测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .intro {
            text-align: center;
            padding: 20px;
        }
        
        .intro h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .intro p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        /* 用户信息表单样式 */
        .user-info-form {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .form-title {
            font-size: 1.1rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .form-row {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .gender-options {
            display: flex;
            gap: 15px;
        }
        
        .gender-option {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .gender-option:hover {
            border-color: #667eea;
            background: #fff;
        }
        
        .gender-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .gender-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .age-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .age-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .question {
            display: none;
        }
        
        .question.active {
            display: block;
        }
        
        .question-number {
            color: #667eea;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .question-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .option-index {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #666;
        }
        
        .option.selected .option-index {
            background: white;
            color: #667eea;
        }
        
        .progress {
            margin-bottom: 20px;
        }
        
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        
        .nav-btn {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .nav-btn.prev {
            background: #f0f0f0;
            color: #666;
        }
        
        .nav-btn.prev:hover {
            background: #e0e0e0;
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .nav-btn.next:hover {
            opacity: 0.9;
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            display: none;
            text-align: center;
        }
        
        .result.show {
            display: block;
        }
        
        .user-info-display {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: inline-flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }
        
        .info-label {
            font-size: 0.9rem;
        }
        
        .info-value {
            font-weight: bold;
            color: #667eea;
        }
        
        .result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .result-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-subtitle {
            color: #667eea;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        .result-desc {
            color: #666;
            line-height: 1.8;
            text-align: left;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
        }
        
        .result-scores {
            text-align: left;
            margin-bottom: 30px;
        }
        
        .score-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .score-label {
            width: 80px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .score-bar {
            flex: 1;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin: 0 15px;
            overflow: hidden;
        }
        
        .score-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 1s ease;
        }
        
        .score-value {
            width: 40px;
            text-align: right;
            color: #333;
            font-weight: bold;
        }
        
        .share-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        
        .share-btn:hover {
            transform: translateY(-2px);
        }
        
        .restart-btn {
            background: #f0f0f0;
            color: #666;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        
        .restart-btn:hover {
            background: #e0e0e0;
        }

        /* 分析详情样式 */
        .analysis-detail {
            text-align: left;
            margin-top: 30px;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        .analysis-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .analysis-section {
            margin-bottom: 20px;
        }

        .analysis-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1rem;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-content {
            color: #555;
            line-height: 1.8;
            padding-left: 24px;
        }

        .section-content ul {
            margin: 0;
            padding-left: 20px;
        }

        .section-content li {
            margin-bottom: 8px;
        }

        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .warning-title {
            color: #856404;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning-content {
            color: #856404;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
            
            .gender-options {
                flex-direction: column;
            }
            
            .user-info-display {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 中医体质测试</h1>
            <p>了解你的体质类型，获得个性化养生建议</p>
        </div>
        
        <div class="card">
            <!-- 介绍页 -->
            <div class="intro" id="intro">
                <h2>👋 欢迎参加中医体质测试</h2>
                
                <!-- 用户信息表单 -->
                <div class="user-info-form">
                    <div class="form-title">📋 请先填写基本信息</div>
                    
                    <div class="form-row">
                        <label class="form-label">性别</label>
                        <div class="gender-options">
                            <div class="gender-option" onclick="selectGender('male', this)">
                                <div class="gender-icon">👨</div>
                                <div>男</div>
                            </div>
                            <div class="gender-option" onclick="selectGender('female', this)">
                                <div class="gender-icon">👩</div>
                                <div>女</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <label class="form-label">年龄</label>
                        <input type="number" class="age-input" id="ageInput" placeholder="请输入您的年龄" min="1" max="120" oninput="validateAge()">
                    </div>
                </div>
                
                <p>本测试基于《中医体质分类与判定》国家标准<br>
                共60-61道题目（根据性别显示相应题目），约需5-10分钟完成<br>
                测试包含9种体质类型：平和质、气虚质、阳虚质、阴虚质、痰湿质、湿热质、血瘀质、气郁质、特禀质</p>
                
                <button class="btn" id="startBtn" onclick="startTest()" disabled>开始测试</button>
            </div>
            
            <!-- 进度条 -->
            <div class="progress" id="progress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text">
                    <span id="currentQ">1</span> / <span id="totalQ">60</span>
                </div>
            </div>
            
            <!-- 题目 -->
            <div id="questions"></div>
            
            <!-- 结果页 -->
            <div class="result" id="result">
                <!-- 用户信息展示 -->
                <div class="user-info-display" id="userInfoDisplay"></div>
                
                <div class="result-icon" id="resultIcon">🌿</div>
                <div class="result-title" id="resultTitle">测试完成</div>
                <div class="result-subtitle" id="resultSubtitle">你的体质类型</div>
                <div class="result-desc" id="resultDesc"></div>
                <div class="result-scores" id="resultScores"></div>
                
                <!-- 详细分析 -->
                <div class="analysis-detail" id="analysisDetail"></div>
                
                <div>
                    <button class="share-btn" onclick="shareResult()">分享结果</button>
                    <button class="restart-btn" onclick="restartTest()">重新测试</button>
                </div>
            </div>
            
            <!-- 导航按钮 -->
            <div class="nav-buttons" id="navButtons" style="display: none;">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">上一题</button>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
            </div>
        </div>
    </div>

                }
            }
        }

        function calculateResult() {
            Object.keys(typeScores).forEach(key => {
                typeScores[key] = 0;
                typeCounts[key] = 0;
            });
            
            // 使用filteredQuestions来计算
            filteredQuestions.forEach((q, index) => {
                const score = answers[index] || 1;
                if (q.type === 'pinghe') {
                    const reverseScore = 6 - score;
                    typeScores[q.type] += reverseScore;
                } else {
                    typeScores[q.type] += score;
                }
                typeCounts[q.type]++;
            });
            
            const transformedScores = {};
            Object.keys(typeScores).forEach(type => {
                if (typeCounts[type] > 0) {
                    transformedScores[type] = Math.round((typeScores[type] - typeCounts[type]) / (typeCounts[type] * 4) * 100);
                } else {
                    transformedScores[type] = 0;
                }
            });
            
            return transformedScores;
        }

        function showResult() {
            const scores = calculateResult();
            
            document.getElementById('progress').style.display = 'none';
            document.getElementById('questions').style.display = 'none';
            document.getElementById('navButtons').style.display = 'none';
            
            // 显示用户信息
            const genderText = userInfo.gender === 'male' ? '男' : '女';
            document.getElementById('userInfoDisplay').innerHTML = `
                <div class="info-item">
                    <span class="info-label">性别：</span>
                    <span class="info-value">${genderText}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">年龄：</span>
                    <span class="info-value">${userInfo.age} 岁</span>
                </div>
            `;
            
            let maxScore = 0;
            let mainType = 'pinghe';
            
            Object.keys(scores).forEach(type => {
                if (type !== 'pinghe' && scores[type] > maxScore) {
                    maxScore = scores[type];
                    mainType = type;
                }
            });
            
            const isPinghe = scores.pinghe >= 60 && Object.keys(scores).filter(t => t !== 'pinghe').every(t => scores[t] < 40);
            
            if (isPinghe) {
                mainType = 'pinghe';
            }
            
            const constInfo = constitutionTypes[mainType];
            
            document.getElementById('resultIcon').textContent = constInfo.icon;
            document.getElementById('resultTitle').textContent = '你是「' + constInfo.name + '」';
            document.getElementById('resultSubtitle').textContent = isPinghe ? '恭喜！这是最理想的体质状态' : '主要体质倾向';
            document.getElementById('resultDesc').textContent = constInfo.shortDesc;
            
            const sortedScores = Object.entries(scores)
                .sort((a, b) => b[1] - a[1])
                .filter(([type]) => type !== 'tebing');
            
            const scoresHtml = sortedScores.map(([type, score]) => {
                const info = constitutionTypes[type];
                const isMain = type === mainType;
                return `
                    <div class="score-item">
                        <span class="score-label">${info.name}</span>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${Math.min(score, 100)}%; background: ${info.color}; animation-delay: 0.1s"></div>
                        </div>
                        <span class="score-value" style="color: ${isMain ? info.color : '#666'}">${score}分</span>
                    </div>
                `;
            }).join('');
            
            document.getElementById('resultScores').innerHTML = `
                <h3 style="margin-bottom: 20px; color: #333;">体质分数明细</h3>
                ${scoresHtml}
            `;
            
            // 生成详细分析
            const analysis = constInfo.analysis;
            const dietGoodList = Array.isArray(analysis.diet.good) 
                ? analysis.diet.good.map(d => `<li>${d}</li>`).join('')
                : `<li>${analysis.diet.good}</li>`;
            const dietBadList = Array.isArray(analysis.diet.bad)
                ? analysis.diet.bad.map(d => `<li>${d}</li>`).join('')
                : `<li>${analysis.diet.bad}</li>`;
            
            const analysisHtml = `
                <div class="analysis-title">${constInfo.icon} 详细体质分析</div>
                
                <div class="analysis-section">
                    <div class="section-title">📋 核心特征</div>
                    <div class="section-content">
                        <ul>
                            ${analysis.characteristics.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                </div>
                
                <div class="analysis-section">
                    <div class="section-title">🍽️ 饮食调理</div>
                    <div class="section-content">
                        <p style="margin-bottom: 12px; font-weight: 500; color: #333;">${analysis.diet.principle}</p>
                        
                        <div style="margin-bottom: 12px;">
                            <strong style="color: #4CAF50;">✓ 适宜食物：</strong>
                            <ul style="margin-top: 8px;">
                                ${dietGoodList}
                            </ul>
                        </div>
                        
                        <div>
                            <strong style="color: #f44336;">✗ 不宜食物：</strong>
                            <ul style="margin-top: 8px;">
                                ${dietBadList}
                            </ul>
                        </div>
                    </div>
                </div>
                
                <div class="analysis-section">
                    <div class="section-title">🏠 生活建议</div>
                    <div class="section-content">
                        <ul>
                            ${analysis.lifestyle.map(l => `<li>${l}</li>`).join('')}
                        </ul>
                    </div>
                </div>
                
                <div class="warning-box">
                    <div class="warning-title">⚠️ 免责声明</div>
                    <div class="warning-content">${analysis.warning}</div>
                </div>
            `;
            
            document.getElementById('analysisDetail').innerHTML = analysisHtml;
            
            document.getElementById('result').classList.add('show');
        }

        function shareResult() {
            const genderText = userInfo.gender === 'male' ? '男' : '女';
            const resultTitle = document.getElementById('resultTitle').textContent;
            const text = `我在做中医体质测试（${genderText}，${userInfo.age}岁），结果是：${resultTitle}。快来看看你是什么体质！`;
            
            if (navigator.share) {
                navigator.share({
                    title: '中医体质测试',
                    text: text,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('结果已复制到剪贴板，可以粘贴分享给朋友！');
                });
            }
        }

        function restartTest() {
            currentQuestion = 0;
            answers = {};
            userInfo = { gender: null, age: null };
            filteredQuestions = [];
            
            Object.keys(typeScores).forEach(key => {
                typeScores[key] = 0;
                typeCounts[key] = 0;
            });
            
            // 重置表单
            document.querySelectorAll('.gender-option').forEach(opt => opt.classList.remove('selected'));
            document.getElementById('ageInput').value = '';
            document.getElementById('startBtn').disabled = true;
            
            document.getElementById('result').classList.remove('show');
            document.getElementById('intro').style.display = 'block';
            document.getElementById('questions').innerHTML = '';
            document.getElementById('questions').style.display = 'block';
        }
    </script>
</body>
</html>
